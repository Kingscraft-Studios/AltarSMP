name: AltarSMP
version: ${project.version}
main: net.kingscraft.zenixmc.altarsmp.AltarSMP
api-version: '1.21'
authors: [Kingscraft-Studios]
contributors: ["Doomwen"]
website: https://modrinth.com/user/Doomwen

description: >
  Premium AltarSMP Plugin No Obfuscation or any Paywall.
  Custom resource pack assets created by Doomwen and loaded externally.

softdepend:
  - WorldGuard
  - WorldEdit

permissions:
  altar.admin:
    default: op
commands:
  bingo:
    description: "Bingo command"
  startbingo:
    permission: altar.admin
  startleggingsevent:
    permission: altar.admin
  starthelmetevent:
    permission: altar.admin
  startchestplateevent:
    permission: altar.admin
  checklegendary:
    permission: altar.admin
  altar:
    permission: altar.admin
  legendaries:
    permission: altar.admin
  controls:
    description: "Controls"
  cooldown:
    permission: altar.admin
  ability1:
    description: "Ability 1"
  ability2:
    description: "Ability 2"
  trust:
    description: "Trust"
  untrust:
    description: "Untrust"
  setkills:
    permission: op
  vampire:
    permission: op